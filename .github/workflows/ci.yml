name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test (termasuk integrasi MySQL dan Redis)
        run: go test -race -count=1 ./...
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PASSWORD: root
          TEST_REDIS_URL: redis://127.0.0.1:6379/15

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t warta-api .

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Periksa skrip backup
        run: shellcheck scripts/*.sh
      - name: Periksa Caddyfile
        run: >-
          docker run --rm -e API_DOMAIN=api.contoh.id -e ACME_EMAIL=admin@contoh.id
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile
      - name: Periksa compose production
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
        env:
          API_DOMAIN: api.contoh.id
          MYSQL_ROOT_PASSWORD: contoh
          DB_PASSWORD: contoh
          JWT_SECRET: contoh
          ADMIN_EMAIL: admin@contoh.id
          ADMIN_PASSWORD: contoh
          CORS_ORIGINS: https://contoh.id
          APP_URL: https://contoh.id
          SMTP_HOST: smtp.contoh.id
          MAIL_FROM: Warta <noreply@contoh.id>
