# Override untuk production. Dipakai bersama docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Semua rahasia wajib diisi lewat .env (lihat .env.example); compose menolak
# jalan bila ada yang kosong, dan service menolak nilai contoh karena
# APP_ENV=production.
#
# Dari luar server hanya Caddy yang terbuka (port 80 dan 443, HTTPS otomatis).
# MySQL, Redis, dan api hanya bisa dijangkau di jaringan compose.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?isi API_DOMAIN, misalnya api.domainmu.id}
      # Alamat untuk pemberitahuan Let's Encrypt, misalnya sertifikat gagal
      # diperbarui.
      ACME_EMAIL: ${ACME_EMAIL:-${ADMIN_EMAIL}}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikat disimpan supaya tidak diminta ulang setiap restart.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # Alamat tetap supaya api bisa mempercayai X-Forwarded-For hanya
        # dari Caddy (TRUSTED_PROXIES).
        ipv4_address: ${CADDY_IP:-172.30.0.10}

  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi MYSQL_ROOT_PASSWORD di .env}
      # Service memakai user sendiri, bukan root. User ini hanya punya akses
      # ke database warta. Catatan: image MySQL hanya membuat user dan password
      # saat volume masih kosong.
      MYSQL_USER: warta
      MYSQL_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
    # Database tidak dibuka ke luar server.
    ports: !reset []
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]

  # Menyimpan rate limit dan pembaca yang sudah dihitung, bersama untuk semua
  # instance api. Isinya boleh hilang (semua kunci punya masa berlaku), jadi
  # tidak perlu disimpan ke disk.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Backup database dan gambar setiap BACKUP_INTERVAL_HOURS jam ke folder
  # BACKUP_HOST_DIR di server (bawaan ./backups), disimpan BACKUP_KEEP_DAYS
  # hari. Lihat scripts/backup.sh dan bagian Backup di README.
  backup:
    image: mysql:8.0
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # Perintah lain: once (backup sekarang), check, restore <folder>.
    entrypoint: ["bash", "/scripts/backup.sh"]
    command: ["loop"]
    environment:
      DB_HOST: mysql
      DB_USER: warta
      DB_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
      DB_NAME: warta
      UPLOAD_DIR: /uploads
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts:/scripts:ro
      # Baca-tulis supaya restore.sh bisa mengembalikan gambar.
      - warta_uploads:/uploads
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD", "bash", "/scripts/backup.sh", "check"]
      interval: 1h
      start_period: 10m

  api:
    depends_on:
      redis:
        condition: service_healthy
    # Hanya dijangkau lewat Caddy. Tanpa port di host, api juga bisa
    # dijalankan beberapa instance: --scale api=3.
    ports: !reset []
    environment:
      APP_ENV: production
      DB_USER: warta
      DB_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?isi ADMIN_EMAIL di .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?isi ADMIN_PASSWORD di .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?isi CORS_ORIGINS dengan origin frontend}
      APP_URL: ${APP_URL:?isi APP_URL dengan alamat https frontend}
      SMTP_HOST: ${SMTP_HOST:?isi SMTP_HOST supaya email verifikasi dan reset password terkirim}
      MAIL_FROM: ${MAIL_FROM:?isi MAIL_FROM, misalnya Warta <noreply@domainmu.id>}
      # Caddy di depan api. Bila ada proxy lain lagi di depan Caddy (misalnya
      # Cloudflare), tambahkan rentang IP-nya setelah IP Caddy.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-${CADDY_IP:-172.30.0.10}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

networks:
  default:
    ipam:
      config:
        # Container lain mendapat IP otomatis dari setengah atas subnet,
        # jadi CADDY_IP di setengah bawah tidak pernah terambil. Bila subnet
        # ini bentrok dengan jaringan lain di server, ganti ketiganya.
        - subnet: ${WARTA_SUBNET:-172.30.0.0/24}
          ip_range: ${WARTA_IP_RANGE:-172.30.0.128/25}

volumes:
  caddy_data:
  caddy_config:
