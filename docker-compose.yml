services:
  mysql:
    image: mysql:8.0
    container_name: sharing-vision-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: article
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # container_name sengaja tidak dipakai di sini supaya service ini bisa
  # dijalankan beberapa instance sekaligus:
  #   docker compose up -d --scale api=3
  api:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_PORT: "8080"
      AUTO_MIGRATE: "true"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: article
    # Untuk menjalankan beberapa instance sekaligus (docker compose up -d --scale api=3),
    # ganti baris di bawah menjadi rentang: "8080-8082:8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
