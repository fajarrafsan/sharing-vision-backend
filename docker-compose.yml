services:
  mysql:
    image: mysql:8.0
    container_name: warta-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: warta
    ports:
      - "3306:3306"
    volumes:
      - warta_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # container_name sengaja tidak dipakai di sini supaya service ini bisa
  # dijalankan beberapa instance sekaligus:
  #   docker compose up -d --scale api=3
  # Semua instance memakai JWT_SECRET, database, dan volume gambar yang sama.
  # Isi REDIS_URL supaya rate limit dan hitungan dibaca juga dihitung bersama
  # (docker-compose.prod.yml sudah menyertakan Redis).
  api:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_PORT: "8080"
      AUTO_MIGRATE: "true"
      LOG_FORMAT: json
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: warta
      UPLOAD_DIR: /app/uploads
      # Nilai bawaan di bawah hanya untuk mencoba di komputer sendiri. Isi
      # JWT_SECRET, ADMIN_EMAIL, dan ADMIN_PASSWORD lewat .env untuk selebihnya.
      JWT_SECRET: ${JWT_SECRET:-ganti-dengan-rahasia-acak-minimal-32-karakter}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@warta.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      APP_URL: ${APP_URL:-http://localhost:5173}
      # Tanpa SMTP_HOST, email verifikasi dan reset password dicatat ke log:
      #   docker compose logs api | grep token=
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Warta <noreply@warta.local>}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-}
      REDIS_URL: ${REDIS_URL:-}
      # local menyimpan gambar di volume warta_uploads; s3 di object storage.
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_PREFIX: ${S3_PREFIX:-uploads/}
    volumes:
      - warta_uploads:/app/uploads
    # Untuk menjalankan beberapa instance sekaligus (docker compose up -d --scale api=3),
    # ganti baris di bawah menjadi rentang: "8080-8082:8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  warta_mysql_data:
  warta_uploads:
